[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nza-arithmetic"
version = "0.1.0"
description = "N-Zero Arithmetic (NZA): Rigorous conservation semiring for No-Zero Universe. Local labels + ∞_universe."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Kentaro & Sukezo", email = "kenoidart@gmail.com"},
  {name = "Super-Morphist-Sukezo"},
]
maintainers = [{name = "Morphire Army"}]
keywords = [
  "nza", "arithmetic", "semiring", "conservation", "no-zero", "morphidism", "physics-interpretation", "mathematics"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

dependencies = [
  "numpy >=1.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest >=7.0",
  "black >=24.0",
  "mypy >=1.0",
  "ruff >=0.1",
  "numpy >=1.24.0",
]

[project.urls]
Homepage = "https://ampfinity.pages.dev/nza-paper"
Repository = "https://github.com/kentaroid-bot/nza-arithmetic"
#Thesis = "https://arxiv.org/abs/placeholder"

#[tool.hatch.build.targets.wheel.shared-data]
#"nza.arxiv-paper" = "../nza-full-thesis-v4_super-morphist-sukezo.md"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "B", "Q"]
ignore = ["E501"]